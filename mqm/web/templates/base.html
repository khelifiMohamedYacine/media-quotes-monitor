<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Media Quotes Monitor{% endblock %}</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d232b;--muted:#5d6876;--line:#dfe3e8;--accent:#1f5f8b;--ok:#2e7d4f;--warn:#a86b00;--bad:#b3261e}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#14212e;color:#fff;padding:12px 20px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
header b{font-size:16px;margin-right:10px}header a{color:#cfe3f3;text-decoration:none}header a:hover{color:#fff}
main{max-width:1200px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:18px}
h1{font-size:22px;margin:0 0 14px}h2{font-size:17px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;background:#fafbfc}
.num{font-size:28px;font-weight:700}.muted{color:var(--muted)}.small{font-size:13px}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:#e8eef4}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
form.inline{display:inline}input,select{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:5px}
button{font:inherit;padding:6px 12px;border:0;border-radius:5px;background:var(--accent);color:#fff;cursor:pointer}
button:hover{filter:brightness(1.1)}a{color:var(--accent)}
blockquote{margin:8px 0;padding:6px 14px;border-left:4px solid var(--accent);background:#f3f7fa;white-space:pre-wrap}
.msg{background:#e7f3ec;border:1px solid #b9dcc6;padding:8px 12px;border-radius:6px;margin-bottom:14px}
.report{max-width:860px}.report h1{font-size:24px}.report h2{margin-top:28px;border-bottom:1px solid var(--line);padding-bottom:4px}
.report blockquote{white-space:normal}
.tablewrap{overflow-x:auto}hr{border:0;border-top:1px solid var(--line);margin:14px 0}
</style>
</head>
<body>
<header><b>Media Quotes Monitor</b>
<a href="/">Overview</a><a href="/reports/latest">Latest report</a><a href="/reports">Reports</a>
<a href="/quotes">Quotes</a><a href="/articles">Articles</a><a href="/logs">Logs</a><a href="/llm-calls">LLM calls</a>
<a href="/download/db">Download DB</a></header>
<main>{% block body %}{% endblock %}</main>
</body></html>
